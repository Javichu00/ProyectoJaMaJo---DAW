<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAM | Dashboard Admin</title>
    <link rel="icon" href="../../multimedia/LogoNegro.png" type="image/png">
    <meta name="description" content="Panel de administracion de JAM. Gestion de usuarios, contenido, transacciones y analitica." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#000000',       
              mist: '#241b13',
              slate: '#BEB7A4',
              ink: '#FFFFFC',        
              'deep-teal': '#FF7F11',
            },
            fontFamily: {
              sans: ['Arimo', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard-styles.css" />
  </head>
  <!-- bg-paper ahora es #000000 gracias al tailwind.config corregido -->
  <body class="bg-paper font-sans text-ink">
    <div class="site-shell">

      <header id="site-header"></header>

      <main id="page-dashboard">

        <div class="dashboard-shell">

          <!-- ── Sidebar ── -->
          <aside class="dash-sidebar">
            <nav class="dash-nav">
              <button class="dash-nav-item active" data-section="usuarios">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                </svg>
                <span>Usuarios</span>
              </button>

              <button class="dash-nav-item" data-section="pagos">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="14" x="2" y="5" rx="2"/>
                  <path d="M2 10h20"/>
                </svg>
                <span>Pagos</span>
              </button>

              <button class="dash-nav-item" data-section="planes">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <span>Planes</span>
              </button>
            </nav>

            <div class="dash-sidebar-footer">
              <div class="dash-admin-badge">
                <div class="dash-admin-avatar">A</div>
                <div class="dash-admin-info">
                  <span class="dash-admin-name">Admin User</span>
                  <span class="dash-admin-role">Administrador</span>
                </div>
              </div>
            </div>
          </aside>

          <!-- ── Main ── -->
          <div class="dash-main">

            <header class="dash-topbar"></header>

            <div class="dash-content" id="dash-content"></div>

          </div>
        </div>

      </main>

      <div id="cartModal" class="dash-modal">
        <div class="dash-modal-inner">
          <div class="dash-modal-head">
            <h3>Editar Carrito</h3>
            <button class="dash-modal-close" onclick="closeCartModal()" aria-label="Cerrar">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="m6 6 12 12"/>
                <path d="M18 6 6 18"/>
              </svg>
            </button>
          </div>
          <div class="dash-modal-body" id="cartModalBody"></div>
        </div>
      </div>

      <footer id="site-footer"></footer>

    </div>
    <script src="../js/api_IP.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/dashboard-script.js" defer></script>
  </body>
</html>
