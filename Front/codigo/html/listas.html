<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAM | Mis listas</title>
    <link rel="icon" href="../../multimedia/LogoNegro.png" type="image/png" />
    <meta name="description" content="Gestiona tus listas de películas y series en JAM." />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/listas.css" />
  </head>
  <body class="bg-paper text-ink">

    <div id="site-header"></div>

    <main class="listas-page">
      <div class="listas-shell shell-width">

      
        <header class="listas-header">
          <div class="listas-header__copy">
            <p class="listas-header__eyebrow">Tu colección</p>
            <h1 class="listas-header__title">Mis listas</h1>
          </div>
          <button class="listas-btn listas-btn--primary" id="btn-nueva-lista" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Nueva lista
          </button>
        </header>

  
        <p class="listas-feedback listas-feedback--error" id="listas-error" hidden></p>

        <div class="listas-grid" id="listas-grid">

        </div>

      </div>
    </main>


    <div class="lista-panel" id="lista-panel" aria-label="Detalle de lista">
      <div class="lista-panel__backdrop" id="lista-panel-backdrop"></div>
      <aside class="lista-panel__drawer" id="lista-panel-drawer">
        <div class="lista-panel__head">
          <div class="lista-panel__head-copy">
            <p class="lista-panel__eyebrow">Lista</p>
            <h2 class="lista-panel__title" id="panel-title">—</h2>
          </div>
          <div class="lista-panel__head-actions">
            <button class="listas-icon-btn" id="btn-rename" title="Renombrar lista" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="listas-icon-btn listas-icon-btn--danger" id="btn-delete-lista" title="Eliminar lista" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
            <button class="listas-icon-btn" id="btn-close-panel" title="Cerrar" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12"/><path d="M18 6 6 18"/></svg>
            </button>
          </div>
        </div>

        <p class="lista-panel__count" id="panel-count"></p>
        <p class="lista-panel__feedback lista-panel__feedback--error" id="panel-error" hidden></p>

        <div class="lista-panel__contenidos" id="panel-contenidos">

        </div>
      </aside>
    </div>


    <div class="listas-modal" id="listas-modal" role="dialog" aria-modal="true">
      <div class="listas-modal__backdrop" id="modal-backdrop"></div>
      <div class="listas-modal__box">
        <h3 class="listas-modal__title" id="modal-title">—</h3>
        <p class="listas-modal__desc" id="modal-desc" hidden></p>
        <input class="listas-modal__input" id="modal-input" type="text" maxlength="60" placeholder="Nombre de la lista" hidden />
        <p class="listas-modal__error" id="modal-error" hidden></p>
        <div class="listas-modal__actions">
          <button class="listas-btn listas-btn--ghost" id="modal-cancel" type="button">Cancelar</button>
          <button class="listas-btn listas-btn--primary" id="modal-confirm" type="button">Confirmar</button>
        </div>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="../js/api_IP.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/listas.js" defer></script>
  </body>
</html>
