<html><head><style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap');

  .pay-wrap { font-family: 'DM Sans', sans-serif; padding: 2rem 1rem; max-width: 480px; margin: 0 auto; }
  .pay-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 2rem; }
  .pay-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .pay-logo { height: 28px; width: auto; }
  .pay-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .pay-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
  .pay-amount { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .pay-amount-label { font-size: 13px; color: var(--color-text-secondary); }
  .pay-amount-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .pay-amount-plan { font-size: 11px; color: var(--color-text-secondary); text-align: right; margin-top: 2px; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.3px; }
  .field input { width: 100%; box-sizing: border-box; height: 40px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 0 12px; font-size: 14px; font-family: 'DM Mono', monospace; background: var(--color-background-primary); color: var(--color-text-primary); outline: none; transition: border-color 0.15s; }
  .field input:focus { border-color: var(--color-border-primary); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-icons { display: flex; gap: 6px; margin-bottom: 1.25rem; }
  .card-icon { height: 24px; border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); display: flex; align-items: center; background: var(--color-background-secondary); }
  .pay-btn { width: 100%; height: 44px; background: #1a1a2e; color: #e8c882; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s, transform 0.1s; }
  .pay-btn:hover { opacity: 0.9; }
  .pay-btn:active { transform: scale(0.99); }
  .pay-secure { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 12px; font-size: 11px; color: var(--color-text-secondary); }
  .pago-error { font-size: 13px; color: #c0392b; margin-top: 8px; min-height: 18px; text-align: center; }
  .success-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(2px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; text-align: center; opacity: 0; visibility: hidden; transition: opacity 0.25s ease; z-index: 20; }
  .success-overlay.is-visible { opacity: 1; visibility: visible; }
  .success-check { width: 56px; height: 56px; border-radius: 50%; background: #eaf3de; display: flex; align-items: center; justify-content: center; }
  .success-check i { font-size: 26px; color: #3B6D11; }
  .success-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .success-msg { font-size: 13px; color: var(--color-text-secondary); text-align: center; max-width: 240px; line-height: 1.6; }
  .success-redirect { font-size: 12px; color: var(--color-text-secondary); }
  .card-relative { position: relative; overflow: hidden; }
</style></head>
<script src="../js/api_IP.js"></script>
<script src="../js/pago.js"></script>
<body>

<div class="pay-wrap">
<div class="pay-card card-relative">

  <div class="pay-header">
    <img src="../../multimedia/LogoNegro.png" alt="JAM" class="pay-logo">
    <div>
      <div class="pay-title">Completar suscripción</div>
      <div class="pay-sub">Pago seguro · jamajo.es</div>
    </div>
  </div>

  <div class="pay-amount">
    <div>
      <div class="pay-amount-label">Total a pagar</div>
    </div>
    <div style="text-align:right">
      <div class="pay-amount-value" id="pago-precio">—</div>
      <div class="pay-amount-plan" id="pago-plan-nombre">—</div>
    </div>
  </div>

  <div class="card-icons">
    <div class="card-icon">VISA</div>
    <div class="card-icon">MC</div>
    <div class="card-icon">AMEX</div>
  </div>

  <div class="field">
    <label>Número de tarjeta</label>
    <input type="text" id="card-num" placeholder="1234 5678 9012 3456" maxlength="19" autocomplete="cc-number">
  </div>
  <div class="field">
    <label>Titular de la tarjeta</label>
    <input type="text" id="card-name" placeholder="Nombre como aparece en la tarjeta" autocomplete="cc-name">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Caducidad</label>
      <input type="text" id="card-exp" placeholder="MM/AA" maxlength="5" autocomplete="cc-exp">
    </div>
    <div class="field">
      <label>CVV</label>
      <input type="text" id="card-cvv" placeholder="•••" maxlength="4" autocomplete="cc-csc">
    </div>
  </div>

  <button class="pay-btn" id="pago-btn">
    <i class="ti ti-lock" aria-hidden="true"></i>
    <span id="pago-btn-text">Pagar</span>
  </button>

  <p class="pago-error" id="pago-error"></p>

  <div class="pay-secure">
    <i class="ti ti-shield-check" aria-hidden="true" style="font-size:13px"></i>
    Cifrado SSL · 3D Secure
  </div>

  <div class="success-overlay" id="pago-success">
    <div class="success-check"><i class="ti ti-check"></i></div>
    <div class="success-title">¡Pago realizado con éxito!</div>
    <div class="success-msg" id="success-msg">Tu suscripción está activa. Redirigiendo a la pantalla principal…</div>
    <div class="success-redirect" id="pago-countdown"></div>
  </div>

</div>
</div>

</body></html>
